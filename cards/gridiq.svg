stroke-opacity=".7"/><text class="mono" x="47" y="152.5" text-anchor="middle" style="font-size:9px;fill:var(--ac)">H</text><circle class="acc" cx="86" cy="149" r="2.5"/><circle cx="108" cy="149" r="6" fill="var(--bg)" stroke="var(--ac)" stroke-opacity=".7"/><line x1="102" y1="149" x2="114" y2="149" stroke="var(--ac)" stroke-opacity=".7"/><line x1="108" y1="143" x2="108" y2="155" stroke="var(--ac)" stroke-opacity=".7"/><rect x="162" y="142" width="20" height="14" rx="3" fill="var(--bg)" stroke="var(--ac)" stroke-opacity=".7"/><path d="M166 153 A6 6 0 0 1 178 153" fill="none" stroke="var(--ac)" stroke-opacity=".7"/><line x1="172" y1="153" x2="176" y2="146" stroke="var(--ac)" stroke-opacity=".7"/><circle r="2.4" cy="149" fill="var(--ac)" filter="url(#gl)"><animate attributeName="cx" values="14;186" dur="3.2s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="3.2s" begin="1.0s" repeatCount="indefinite"/></circle></g></svg>