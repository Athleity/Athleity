<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150"><style>
:root{--bg:#0d1117;--bd:#30363d;--fg:#e6edf3;--mu:#8b949e;--ac:#39d353;--ac2:#26a641}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--bd)}
.trk{fill:var(--bd)}
.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:.06em;fill:var(--fg)}
.k2{font-size:11px;fill:var(--mu)}
.v2{font-size:11px;font-weight:600;fill:var(--fg);text-anchor:end}
.k{font-size:12px;fill:var(--mu)}
.v{font-size:12px;font-weight:600;fill:var(--fg);text-anchor:end}
.s{font-size:10px;fill:var(--mu)}
.sub{font-size:13px;fill:var(--mu)}
.big{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:var(--ac)}
.acc{fill:var(--ac)}
.l0{fill:#161b22}.l1{fill:#0e4429}.l2{fill:#006d32}.l3{fill:#26a641}.l4{fill:#39d353}
.line{opacity:0;animation:cycle 16s infinite}
@keyframes cycle{0%{opacity:0}4%,22%{opacity:1}26%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.line{opacity:0}.line.f{opacity:1}}
</style><defs><radialGradient id="sph" cx=".38" cy=".32" r=".8"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.18"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:.02"/></radialGradient><linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--ac);stop-opacity:0"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:.35"/></linearGradient></defs><rect class="bg" x=".5" y=".5" width="199" height="149" rx="10"/><rect class="acc" x="14" y="16" width="7" height="7" rx="1.5"/><text class="t" x="27" y="24">ENTANGLEMENT</text><text class="big" x="14" y="60">Qubits</text><text class="s" x="14" y="86">quantum entanglement project</text><text class="k2" x="14" y="108">Language</text><text class="v2" x="186" y="108">Jupyter Notebook</text><text class="k2" x="14" y="124">Stars</text><text class="v2" x="186" y="124">1</text><text class="k2" x="14" y="140">Updated</text><text class="v2" x="186" y="140">Apr 2026</text></svg>