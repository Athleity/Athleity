<svg xmlns="http://www.w3.org/2000/svg" width="830" height="112" viewBox="0 0 830 112"><style>
:root{--bg:#fff;--bd:#d1d9e0;--fg:#1f2328;--mu:#59636e;--ac:#1a7f37;--ac2:#2da44e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--bd:#30363d;--fg:#e6edf3;--mu:#8b949e;--ac:#3fb950;--ac2:#56d364}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--bd)}
.trk{fill:var(--bd)}
.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:.06em;fill:var(--fg)}
.k2{font-size:11px;fill:var(--mu)}
.v2{font-size:11px;font-weight:600;fill:var(--fg);text-anchor:end}
.k{font-size:12px;fill:var(--mu)}
.v{font-size:12px;font-weight:600;fill:var(--fg);text-anchor:end}
.s{font-size:10px;fill:var(--mu)}
.sub{font-size:13px;fill:var(--mu)}
.big{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:var(--ac)}
.acc{fill:var(--ac)}
.l0{fill:var(--bd);fill-opacity:.55}
.l1{fill:var(--ac);fill-opacity:.3}
.l2{fill:var(--ac);fill-opacity:.5}
.l3{fill:var(--ac);fill-opacity:.75}
.l4{fill:var(--ac)}
.live{fill:var(--ac2)}
.in{animation:rise .6s ease-out both}
.grow{transform-box:fill-box;transform-origin:left;animation:sweep 1.2s .4s ease-out both}
.cell{animation:pop .5s ease-out both}
.now,.dot{animation:pulse 1.6s ease-in-out infinite}
.line{opacity:0;animation:cycle 16s infinite}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes cycle{0%{opacity:0}4%,22%{opacity:1}26%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.line{opacity:0}.line.f{opacity:1}}
</style><rect class="bg" x=".5" y=".5" width="829" height="111" rx="12"/><rect class="acc" x="0.5" y="22" width="4" height="40" rx="2"/><g class="in"><text x="30" y="46" font-size="28" font-weight="800" letter-spacing=".01em" fill="var(--fg)">Priyansh Bhavsar</text><text class="sub" x="30" y="66">BS Physics · Quantum Technologies, IIT Jodhpur</text><text class="mono line f" x="30" y="84" font-size="13" fill="var(--fg)" style="animation-delay:0s"><tspan class="acc">$</tspan> QAOA on Rigetti Ankaa-3 · Best Overall, Q-volution 2026</text><text class="mono line" x="30" y="84" font-size="13" fill="var(--fg)" style="animation-delay:4s"><tspan class="acc">$</tspan> Lightning-Lite: C++20 statevector simulator, 3.5x vs Qiskit Aer</text><text class="mono line" x="30" y="84" font-size="13" fill="var(--fg)" style="animation-delay:8s"><tspan class="acc">$</tspan> Now: surface-code quantum error correction</text><text class="mono line" x="30" y="84" font-size="13" fill="var(--fg)" style="animation-delay:12s"><tspan class="acc">$</tspan> Translating papers into working code</text></g><rect x="600" y="22" width="200" height="22" rx="11" fill="none" stroke="var(--bd)"/><circle class="live dot" cx="614" cy="33" r="3.5"/><text class="s" x="624" y="36">open to quantum research</text></svg>