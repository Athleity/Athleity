<svg xmlns="http://www.w3.org/2000/svg" width="830" height="124" viewBox="0 0 830 124"><style>
:root{--bg:#fff;--bd:#d0d7de;--fg:#1f2328;--mu:#656d76;--ac:#0969da;--ac2:#8250df}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--bd:#30363d;--fg:#e6edf3;--mu:#8b949e;--ac:#58a6ff;--ac2:#bc8cff}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--bd)}
.trk{fill:var(--bd)}
.sh{fill:var(--ac);opacity:.9}
.t{font-size:11px;font-weight:600;letter-spacing:.09em;fill:var(--ac)}
.k{font-size:12px;fill:var(--mu)}
.v{font-size:12px;font-weight:600;fill:var(--fg);text-anchor:end}
.k2{font-size:11px;fill:var(--mu)}
.v2{font-size:11px;font-weight:600;fill:var(--fg);text-anchor:end}
.s{font-size:10px;fill:var(--mu)}
.sub{font-size:13px;fill:var(--mu)}
.acc{fill:var(--ac)}
.l0{fill:var(--bd);fill-opacity:.5}
.l1{fill:var(--ac);fill-opacity:.28}
.l2{fill:var(--ac);fill-opacity:.5}
.l3{fill:var(--ac);fill-opacity:.75}
.l4{fill:var(--ac)}
.orb{fill:none;stroke:var(--ac);stroke-opacity:.4}
.el{fill:var(--ac2)}
.ring{fill:none;stroke:var(--bd);stroke-dasharray:2 5}
.live{fill:#3fb950}
.in{animation:rise .7s ease-out both}
.grow{animation:sweep 1.4s .4s ease-out both}
.cell{animation:pop .5s ease-out both}
.now,.dot{animation:pulse 1.6s ease-in-out infinite}
.line{opacity:0;animation:cycle 16s infinite}
.spin{transform-origin:700px 62px;animation:spin 40s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes cycle{0%{opacity:0;transform:translateY(6px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.line{opacity:0}.line.f{opacity:1}}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" style="stop-color:var(--ac)"/><stop offset=".5" style="stop-color:var(--ac2)"/><stop offset="1" style="stop-color:var(--ac)"/><animate attributeName="x1" values="0;1" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="1;2" dur="5s" repeatCount="indefinite"/></linearGradient><radialGradient id="rg"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.2"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:0"/></radialGradient></defs><rect class="bg" x=".5" y=".5" width="829" height="123" rx="14"/><circle cx="700" cy="62" r="115" fill="url(#rg)"/><g class="in"><text x="30" y="44" font-size="28" font-weight="800" letter-spacing=".02em" fill="url(#g)">PRIYANSH BHAVSAR</text><text class="sub" x="30" y="64">BS Physics · Quantum Technologies — IIT Jodhpur</text><text class="mono line f" x="30" y="88" font-size="13" style="animation-delay:0s"><tspan class="acc">›</tspan> Running QAOA on real quantum hardware</text><text class="mono line" x="30" y="88" font-size="13" style="animation-delay:4s"><tspan class="acc">›</tspan> Building quantum simulators from scratch in C++</text><text class="mono line" x="30" y="88" font-size="13" style="animation-delay:8s"><tspan class="acc">›</tspan> Translating research papers into working code</text><text class="mono line" x="30" y="88" font-size="13" style="animation-delay:12s"><tspan class="acc">›</tspan> Chasing noise instead of averaging it away</text><rect x="30" y="98" width="290" height="18" rx="9" fill="none" stroke="var(--bd)"/><circle class="live dot" cx="42" cy="107" r="3"/><text class="s" x="52" y="110">building Lightning-Lite · surface-code QEC</text></g><circle class="ring" cx="700" cy="62" r="56"/><g class="spin"><g transform="rotate(0 700 62)"><ellipse class="orb" cx="700" cy="62" rx="52" ry="18"/><circle class="el" r="3"><animateMotion dur="3.0s" repeatCount="indefinite" path="M648,62 a52,18 0 1,0 104,0 a52,18 0 1,0 -104,0"/></circle></g><g transform="rotate(60 700 62)"><ellipse class="orb" cx="700" cy="62" rx="52" ry="18"/><circle class="el" r="3"><animateMotion dur="4.0s" repeatCount="indefinite" path="M648,62 a52,18 0 1,0 104,0 a52,18 0 1,0 -104,0"/></circle></g><g transform="rotate(120 700 62)"><ellipse class="orb" cx="700" cy="62" rx="52" ry="18"/><circle class="el" r="3"><animateMotion dur="5.0s" repeatCount="indefinite" path="M648,62 a52,18 0 1,0 104,0 a52,18 0 1,0 -104,0"/></circle></g></g><circle class="acc dot" cx="700" cy="62" r="4.5"/><text class="s mono" x="762" y="66" style="font-size:12px">|0⟩</text><text class="s mono" x="612" y="66" style="font-size:12px">|1⟩</text></svg>