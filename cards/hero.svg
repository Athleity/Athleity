troke-width=".8"><line x1="46" y1="25" x2="55" y2="23"/><line x1="46" y1="27" x2="55" y2="28"/><line x1="34" y1="25" x2="25" y2="23"/><line x1="34" y1="27" x2="25" y2="28"/></g><ellipse class="acc" cx="30" cy="55" rx="5" ry="2.5"/><ellipse class="acc" cx="39" cy="55" rx="5" ry="2.5"/></g><line x1="728" y1="89.5" x2="820" y2="89.5" stroke="var(--bd)"/></svg>